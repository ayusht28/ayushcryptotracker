name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Lint & Test ─────────────────────────────────────────────────────────────
  test-price-service:
    name: Price Service — lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/price-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: services/price-service/package-lock.json }
      - run: npm ci
      - run: node -e "require('./src/cache'); require('./src/routes'); console.log('OK')"

  test-gateway:
    name: Gateway — lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: services/gateway/package-lock.json }
      - run: npm ci
      - run: node --check src/index.js src/db.js src/redis.js src/websocket.js src/pricePoller.js src/routes/market.js src/routes/portfolio.js src/routes/alerts.js

  test-notifier:
    name: Notifier — lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notifier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: services/notifier/package-lock.json }
      - run: npm ci
      - run: node --check src/index.js src/alertEvaluator.js

  test-frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: https://placeholder.onrender.com
          VITE_WS_URL: wss://placeholder.onrender.com

  # ── Deploy to Render (runs only on push to main, after all tests pass) ──────
  deploy:
    name: Deploy to Render
    needs: [test-price-service, test-gateway, test-notifier, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy Price Service
        run: |
          curl -s -X POST "${{ secrets.RENDER_PRICE_HOOK }}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print('Price Service deploy:', d.get('id','ok'))"

      - name: Deploy Gateway
        run: |
          curl -s -X POST "${{ secrets.RENDER_GATEWAY_HOOK }}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print('Gateway deploy:', d.get('id','ok'))"

      - name: Deploy Notifier
        run: |
          curl -s -X POST "${{ secrets.RENDER_NOTIFIER_HOOK }}" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print('Notifier deploy:', d.get('id','ok'))"
